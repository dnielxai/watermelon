<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Watermelon — Personal Calendar & Progress</title>

  <!-- PWA / Desktop App -->
  <meta name="theme-color" content="#e85a4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Watermelon" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f2e7;
      --surface: #fffcf7;
      --surface-2: #fbf7ee;
      --border: #e7dfd0;
      --text: #23342b;
      --text-secondary: #7a827c;
      --text-tertiary: #a3aaa5;
      --accent: #ec655e;
      --accent-hover: #d9544e;
      --accent-soft: rgba(236, 101, 94, 0.12);
      --green: #2b7b57;
      --green-soft: #3d9b6e;
      --orange: #f0a04b;
      --red: #ec655e;
      --purple: #9b7ebd;
      --pink: #f28482;
      --yellow: #f2c84b;
      --blue: #77aabd;
      --shadow: 0 2px 12px rgba(80, 50, 40, 0.05);
      --shadow-lg: 0 10px 36px rgba(80, 50, 40, 0.09);
      --radius: 18px;
      --radius-sm: 12px;
      --sidebar-width: 250px;
      --transition: 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    [data-theme="dark"] {
      --bg: #19251f;
      --surface: #24332c;
      --surface-2: #2a3a32;
      --border: #3b4d43;
      --text: #f8f1e3;
      --text-secondary: #abb7af;
      --text-tertiary: #7a8a80;
      --accent: #f28482;
      --accent-hover: #f5a09e;
      --accent-soft: rgba(242, 132, 130, 0.15);
      --green: #4caf70;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 36px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Soft grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74, 145, 154, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 145, 154, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }
    .app { position: relative; z-index: 1; }

    /* Decorative stickers (Twinkling Watermelon inspired) */
    .sticker-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sticker {
      position: absolute;
      opacity: 0.14;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
    }
    [data-theme="dark"] .sticker { opacity: 0.09; }

    /* ========== LAYOUT ========== */
    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 28px;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 18px;
    }
    .logo-icon.melon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2b7b57;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-8deg);
      flex-shrink: 0;
    }
    .melon-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ec655e;
      border: 2px solid #f8d963;
      position: relative;
      overflow: hidden;
    }
    .melon-inner span {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #23342b;
      border-radius: 50%;
    }
    .melon-inner span:nth-child(1) { top: 6px; left: 8px; }
    .melon-inner span:nth-child(2) { top: 12px; left: 13px; }
    .melon-inner span:nth-child(3) { top: 10px; left: 5px; }
    .logo-text {
      font-weight: 700;
      font-size: 20px;
      color: var(--green);
      letter-spacing: -0.5px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin: 0 4px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f28482;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .profile-name { font-size: 13.5px; font-weight: 600; }
    .profile-sub { font-size: 11.5px; color: var(--text-secondary); }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 0.6px;
      padding: 0 14px 8px;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14.5px;
      font-weight: 500;
      transition: all var(--transition);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.active {
      background: #fde8e6;
      color: var(--accent);
      font-weight: 600;
    }
    [data-theme="dark"] .nav-item.active {
      background: var(--accent-soft);
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .theme-toggle, .export-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      background: none;
      border: none;
      width: 100%;
      transition: all var(--transition);
    }

    .theme-toggle:hover, .export-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 980px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background: #ec655e;
      color: white;
      box-shadow: 0 2px 10px rgba(236, 101, 94, 0.28);
      border-radius: 999px;
    }

    .btn-primary:hover {
      background: #d9544e;
      transform: scale(1.02);
      box-shadow: 0 4px 14px rgba(236, 101, 94, 0.38);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-icon:hover {
      background: var(--border);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    /* ========== VIEWS ========== */
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .card-body {
      padding: 20px 22px;
    }

    /* ========== DASHBOARD ========== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .hero-banner {
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      min-height: 160px;
      box-shadow: var(--shadow);
    }
    .hero-left {
      background: #2b7b57;
      color: #fff;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .hero-date {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    .hero-left h2 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #f8f1e3;
    }
    .hero-left h2 span { color: #f2c84b; }
    .hero-left p, .hero-quote {
      font-size: 14px;
      opacity: 0.92;
      max-width: 320px;
      line-height: 1.5;
      font-style: italic;
      margin-top: 4px;
    }

    /* Intro splash — auto-hides with CSS only (no JS required) */
    .intro-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f7f2e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      animation: splashOut 0.65s ease 1.4s forwards;
      pointer-events: none;
    }
    @keyframes splashOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    .intro-melon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #2b7b57;
      padding: 8px;
      animation: introPop 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }
    .intro-melon-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ec655e;
      border: 3px solid #f8d963;
      position: relative;
    }
    .intro-melon-inner span {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #23342b;
      border-radius: 50%;
    }
    .intro-melon-inner span:nth-child(1) { top: 14px; left: 16px; }
    .intro-melon-inner span:nth-child(2) { top: 24px; left: 28px; }
    .intro-melon-inner span:nth-child(3) { top: 20px; left: 12px; }
    .intro-title {
      font-size: 28px;
      font-weight: 700;
      color: #2b7b57;
      letter-spacing: -0.6px;
      animation: introFade 0.6s 0.25s both;
    }
    .intro-sub {
      font-size: 14px;
      color: #7a827c;
      animation: introFade 0.6s 0.4s both;
    }
    @keyframes introPop {
      from { opacity: 0; transform: scale(0.5) rotate(-20deg); }
      to { opacity: 1; transform: scale(1) rotate(-8deg); }
    }
    @keyframes introFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Smooth page entrance */
    .app {
      animation: appIn 0.45s ease both;
    }
    @keyframes appIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .view.active {
      animation: viewIn 0.35s ease both;
    }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stat-card, .card, .hero-banner {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .stat-card:hover, .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .nav-item {
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }
    .nav-item:active { transform: scale(0.97); }
    .btn-primary {
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .profile-card {
      transition: box-shadow 0.25s ease;
    }
    .profile-card:hover {
      box-shadow: var(--shadow);
    }
    .hero-right {
      background: #f2c84b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hero-melon {
      width: 120px;
      height: 90px;
      position: relative;
      animation: melonFloat 3.5s ease-in-out infinite;
    }
    .hero-melon-body {
      width: 108px;
      height: 66px;
      background: #ec655e;
      border-radius: 50% 50% 45% 45%;
      border: 5px solid #2b7b57;
      position: relative;
      box-shadow: 0 8px 20px rgba(43, 123, 87, 0.25);
    }
    .hero-melon-body::before {
      content: '';
      position: absolute;
      inset: 7px;
      border-radius: inherit;
      border: 2px dashed rgba(255,255,255,0.35);
    }
    .hero-melon-body::after {
      content: '';
      position: absolute;
      top: 18px; left: 28px;
      width: 6px; height: 6px;
      background: #23342b;
      border-radius: 50%;
      box-shadow: 18px 8px 0 #23342b, 8px 16px 0 #23342b;
    }
    @keyframes melonFloat {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 12.5px;
      color: var(--text-tertiary);
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.8px;
    }

    .stat-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Progress rings */
    .rings {
      display: flex;
      gap: 28px;
      justify-content: center;
      padding: 12px 0;
    }

    .ring-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .ring {
      width: 90px;
      height: 90px;
      position: relative;
    }

    .ring svg {
      transform: rotate(-90deg);
      width: 90px;
      height: 90px;
    }

    .ring-bg {
      fill: none;
      stroke: var(--surface-2);
      stroke-width: 7;
    }

    .ring-progress {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    .ring-value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
    }

    .ring-label {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Today list */
    .today-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .today-item:last-child { border-bottom: none; }

    .today-time {
      font-size: 12.5px;
      color: var(--text-tertiary);
      font-weight: 500;
      min-width: 52px;
    }

    .today-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .today-title {
      font-size: 14px;
      font-weight: 500;
      flex: 1;
    }

    .today-title.done {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }

    /* ========== CALENDAR ========== */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calendar-month {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      min-width: 200px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .cal-day-header {
      background: var(--surface);
      padding: 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .cal-day {
      background: var(--surface);
      min-height: 110px;
      padding: 8px;
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
    }

    .cal-day:hover {
      background: var(--surface-2);
    }

    .cal-day.other-month {
      background: var(--bg);
    }

    .cal-day.other-month .day-num {
      color: var(--text-tertiary);
    }

    .cal-day.today .day-num {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-day.selected {
      background: var(--accent-soft);
    }

    .day-num {
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-events {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day-event {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      color: white;
      min-height: 16px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .day-event:hover {
      opacity: 0.85;
    }

    /* Multi-day event visual continuity */
    .day-event.multi-start {
      border-radius: 4px 0 0 4px;
      margin-right: -2px;
    }
    .day-event.multi-mid {
      border-radius: 0;
      margin-left: -2px;
      margin-right: -2px;
    }
    .day-event.multi-end {
      border-radius: 0 4px 4px 0;
      margin-left: -2px;
    }

    /* PH Holidays */
    .day-event.holiday-event {
      background: #2b7b57 !important;
      color: #fff;
      cursor: default;
      font-weight: 600;
    }
    .day-event.holiday-event.special {
      background: #c45c7a !important;
    }
    .cal-day.has-holiday {
      background: rgba(43, 123, 87, 0.06);
    }
    .cal-day.has-holiday .day-num {
      color: #2b7b57;
      font-weight: 700;
    }

    /* ========== TASKS ========== */
    .tasks-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      height: calc(100vh - 140px);
    }

    .task-filters {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      height: fit-content;
    }

    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .filter-item:hover, .filter-item.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .filter-count {
      font-size: 12px;
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-tertiary);
    }

    .filter-item.active .filter-count {
      background: var(--accent);
      color: white;
    }

    .task-list {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    .task-item:hover {
      background: var(--surface-2);
    }

    .task-item:last-child { border-bottom: none; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-tertiary);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      background: none;
    }

    .task-check:hover {
      border-color: var(--accent);
    }

    .task-check.done {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 14.5px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .task-title.done {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .task-priority {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .priority-high { background: var(--red); }
    .priority-medium { background: var(--orange); }
    .priority-low { background: var(--green); }

    .task-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .task-item:hover .task-actions {
      opacity: 1;
    }

    /* ========== NOTES ========== */
    .notes-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      height: calc(100vh - 140px);
    }

    .notes-list {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-y: auto;
    }

    .note-item {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }

    .note-item:hover, .note-item.active {
      background: var(--accent-soft);
    }

    .note-item-title {
      font-size: 14.5px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-preview {
      font-size: 12.5px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-item-date {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    .note-editor {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .note-editor-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .note-title-input {
      flex: 1;
      border: none;
      background: none;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      font-family: inherit;
      outline: none;
    }

    .note-body {
      flex: 1;
      padding: 22px;
      border: none;
      background: none;
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      font-family: inherit;
      resize: none;
      outline: none;
    }

    .empty-note {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      gap: 12px;
    }

    /* ========== PROGRESS / GOALS ========== */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .goal-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .goal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .goal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .goal-category {
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .goal-progress-bar {
      height: 8px;
      background: var(--surface-2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .goal-progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .goal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,159,10,0.12);
      color: var(--orange);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 22px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--border);
      color: var(--text);
    }

    .modal-body {
      padding: 20px 24px 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
    }

    .form-textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all var(--transition);
    }

    .color-swatch.selected {
      border-color: var(--text);
      transform: scale(1.15);
    }

    .modal-footer {
      padding: 0 24px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Empty states */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-tertiary);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 13.5px;
      max-width: 280px;
      margin: 0 auto;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ========== TOAST ========== */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      max-width: 360px;
      pointer-events: auto;
      animation: toastIn 0.3s ease;
    }
    .toast.out { animation: toastOut 0.25s ease forwards; }
    .toast-success { border-left: 3px solid var(--green); }
    .toast-error { border-left: 3px solid var(--red); }
    .toast-info { border-left: 3px solid var(--accent); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(8px) scale(0.96); }
    }

    /* ========== SEARCH ========== */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      width: 240px;
      transition: all var(--transition);
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-box input {
      border: none;
      background: none;
      outline: none;
      font-size: 13.5px;
      color: var(--text);
      font-family: inherit;
      width: 100%;
    }
    .search-box input::placeholder { color: var(--text-tertiary); }

    /* ========== FOCUS TIMER ========== */
    .focus-panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .focus-time {
      font-size: 56px;
      font-weight: 300;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      margin: 12px 0 20px;
    }
    .focus-modes {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .focus-mode-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .focus-mode-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .focus-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    /* Event clickable */
    .day-event {
      cursor: pointer;
    }
    .day-event:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    /* Week view */
    .calendar-grid.week-view {
      grid-template-columns: 60px repeat(7, 1fr);
    }
    .week-time-label {
      background: var(--surface);
      padding: 8px;
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    .week-day-header {
      background: var(--surface);
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    .week-day-header.today {
      color: var(--accent);
    }
    .week-cell {
      background: var(--surface);
      min-height: 48px;
      padding: 4px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }
    .week-cell:hover { background: var(--surface-2); }
    .week-cell.today-col { background: var(--accent-soft); }

    /* ========== WHITEBOARD ========== */
    .wb-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      gap: 12px;
    }
    .wb-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 10px;
    }
    .wb-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .wb-tool {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .wb-tool:hover { background: var(--surface-2); color: var(--text); }
    .wb-tool.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }
    .wb-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }
    .wb-colors {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .wb-color {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform var(--transition);
    }
    .wb-color:hover { transform: scale(1.15); }
    .wb-color.active {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--surface);
    }
    .wb-size input[type="range"] {
      width: 90px;
      accent-color: var(--accent);
    }
    .wb-actions {
      display: flex;
      gap: 8px;
    }
    .wb-canvas-wrap {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }
    #wbCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      background: #ffffff;
    }
    [data-theme="dark"] #wbCanvas {
      background: #1c1c1e;
    }

    /* Habit heatmap */
    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 12px;
    }
    .heatmap-day {
      aspect-ratio: 1;
      border-radius: 3px;
      background: var(--surface-2);
      transition: all var(--transition);
    }
    .heatmap-day.level-1 { background: rgba(52,199,89,0.25); }
    .heatmap-day.level-2 { background: rgba(52,199,89,0.45); }
    .heatmap-day.level-3 { background: rgba(52,199,89,0.7); }
    .heatmap-day.level-4 { background: var(--green); }
    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 8px;
      justify-content: flex-end;
    }

    /* Delete button in modal */
    .btn-danger {
      background: rgba(255,59,48,0.1);
      color: var(--red);
      border: 1px solid rgba(255,59,48,0.2);
    }
    .btn-danger:hover {
      background: var(--red);
      color: white;
    }

    /* Modal footer flex */
    .modal-footer {
      justify-content: space-between;
    }
    .modal-footer-right {
      display: flex;
      gap: 10px;
    }

    /* Command palette style quick actions */
    .quick-stats {
      display: flex;
      gap: 16px;
      font-size: 12.5px;
      color: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { width: 68px; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .tasks-layout, .notes-layout { grid-template-columns: 1fr; }
      .search-box { width: 160px; }
    }

    /* Desktop-friendly content sizing: keep the sidebar and header in place
       while allowing Calendar and Progress to scroll when content grows. */
    .app { height: 100vh; height: 100dvh; min-height: 0; }
    .sidebar, .main { min-height: 0; }
    .main { min-width: 0; }
    .content {
      min-height: 0;
      height: 0;
      flex: 1 1 auto;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    #view-calendar, #view-progress { min-width: 0; padding-bottom: 20px; }
    .calendar-grid { min-width: 0; }
    .cal-day { min-width: 0; min-height: clamp(84px, 12vh, 116px); }
    .calendar-header { flex-wrap: wrap; gap: 14px; }
    .calendar-month { min-width: 0; }
    .goals-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
    .goal-card { min-width: 0; }
    .workspace-tag {
      margin: 0 4px 20px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }
    .workspace-tag-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 27px;
      height: 27px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 17px;
    }
    @media (max-width: 1100px) {
      .content { padding: 20px 22px; }
      .cal-day { padding: 6px; }
      .cal-day-header { padding: 9px 4px; }
    }

    /* Soft custom desktop titlebar replaces the system's blue titlebar. */
    .wm-titlebar {height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:10002;user-select:none;}
    .wm-drag-region {-webkit-app-region:drag;display:flex;align-items:center;gap:8px;padding-left:16px;flex:1;height:100%;font-size:13px;font-weight:750;color:var(--green);}
    .wm-drag-region img {width:19px;height:19px;object-fit:contain;}
    .wm-title-hint {font-weight:400;font-size:11px;color:var(--text-tertiary);margin-left:5px;}
    .wm-window-controls {display:flex;align-items:center;height:100%;-webkit-app-region:no-drag;}
    .wm-window-controls button {height:32px;width:40px;margin-right:4px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--text-secondary);cursor:pointer;transition:background .15s,color .15s;}
    .wm-window-controls button svg {height:17px;width:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .wm-window-controls button:hover {background:var(--accent-soft);color:var(--accent);}
    #wmClose:hover {background:#ffe3e3;color:#d84b4b;}
    .app {height:calc(100vh - 38px)!important;height:calc(100dvh - 38px)!important;}
    .today-progress {padding-top:28px;padding-bottom:25px;scroll-margin-top:20px;}
    .today-progress-header {display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
    .today-progress-kicker {font-size:10px;letter-spacing:1.3px;font-weight:700;color:var(--green);margin-bottom:6px;}
    .today-progress-header h2 {font-size:22px;font-weight:700;margin:0 0 5px;}
    .today-progress-header p {font-size:13px;color:var(--text-secondary);}
    .today-progress .goals-grid {min-width:0;}


    /* Compact navigation: automatically collapse after 12 seconds idle.
       Toggle always stays visible, and full labels return when expanded. */
    .sidebar { overflow:hidden; transition:width .28s cubic-bezier(.2,.8,.2,1); }
    .sidebar .logo {gap:9px;padding-left:4px;padding-right:2px;min-height:49px;}
    .sidebar-toggle {margin-left:auto;flex:0 0 29px;width:29px;height:29px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--green);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .25s;}
    .sidebar-toggle:hover {background:var(--accent-soft);}
