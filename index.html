  <script>
    // ==================== DATA ====================
    const STORAGE_KEY = 'lumina_data_v1';

    let state = {
      events: [],
      tasks: [],
      notes: [],
      goals: [],
      currentView: 'dashboard',
      currentMonth: new Date(),
      calendarMode: 'month', // 'month' | 'week'
      selectedDate: null,
      selectedNoteId: null,
      taskFilter: 'all',
      theme: 'light',
      editingId: null,
      modalType: null
    };

    const COLORS = [
      { name: 'Coral', value: '#e85a4f' },
      { name: 'Watermelon', value: '#f28482' },
      { name: 'Sunshine', value: '#f2c94c' },
      { name: 'Leaf', value: '#4caf70' },
      { name: 'Sky', value: '#5b9bd5' },
      { name: 'Lavender', value: '#9b7ebd' },
      { name: 'Peach', value: '#f0a04b' },
      { name: 'Berry', value: '#c45c7a' }
    ];

    // Philippine holidays (regular + special non-working / nationwide observances)
    // Updated for 2025–2027; movable dates use announced / typical dates
    const PH_HOLIDAYS = [
      // 2025
      { date: '2025-01-01', title: 'New Year\'s Day', type: 'regular' },
      { date: '2025-01-29', title: 'Chinese New Year', type: 'special' },
      { date: '2025-04-09', title: 'Araw ng Kagitingan', type: 'regular' },
      { date: '2025-04-17', title: 'Maundy Thursday', type: 'regular' },
      { date: '2025-04-18', title: 'Good Friday', type: 'regular' },
      { date: '2025-04-19', title: 'Black Saturday', type: 'special' },
      { date: '2025-05-01', title: 'Labor Day', type: 'regular' },
      { date: '2025-06-12', title: 'Independence Day', type: 'regular' },
      { date: '2025-08-21', title: 'Ninoy Aquino Day', type: 'special' },
      { date: '2025-08-25', title: 'National Heroes Day', type: 'regular' },
      { date: '2025-11-01', title: 'All Saints\' Day', type: 'special' },
      { date: '2025-11-30', title: 'Bonifacio Day', type: 'regular' },
      { date: '2025-12-08', title: 'Feast of the Immaculate Conception', type: 'special' },
      { date: '2025-12-25', title: 'Christmas Day', type: 'regular' },
      { date: '2025-12-30', title: 'Rizal Day', type: 'regular' },
      { date: '2025-12-31', title: 'Last Day of the Year', type: 'special' },
      // 2026
      { date: '2026-01-01', title: 'New Year\'s Day', type: 'regular' },
      { date: '2026-02-17', title: 'Chinese New Year', type: 'special' },
      { date: '2026-04-02', title: 'Maundy Thursday', type: 'regular' },
      { date: '2026-04-03', title: 'Good Friday', type: 'regular' },
      { date: '2026-04-04', title: 'Black Saturday', type: 'special' },
      { date: '2026-04-09', title: 'Araw ng Kagitingan', type: 'regular' },
      { date: '2026-05-01', title: 'Labor Day', type: 'regular' },
      { date: '2026-06-12', title: 'Independence Day', type: 'regular' },
      { date: '2026-08-21', title: 'Ninoy Aquino Day', type: 'special' },
      { date: '2026-08-31', title: 'National Heroes Day', type: 'regular' },
      { date: '2026-11-01', title: 'All Saints\' Day', type: 'special' },
      { date: '2026-11-30', title: 'Bonifacio Day', type: 'regular' },
      { date: '2026-12-08', title: 'Feast of the Immaculate Conception', type: 'special' },
      { date: '2026-12-24', title: 'Christmas Eve', type: 'special' },
      { date: '2026-12-25', title: 'Christmas Day', type: 'regular' },
      { date: '2026-12-30', title: 'Rizal Day', type: 'regular' },
      { date: '2026-12-31', title: 'Last Day of the Year', type: 'special' },
      // 2027
      { date: '2027-01-01', title: 'New Year\'s Day', type: 'regular' },
      { date: '2027-02-06', title: 'Chinese New Year', type: 'special' },
      { date: '2027-03-25', title: 'Maundy Thursday', type: 'regular' },
      { date: '2027-03-26', title: 'Good Friday', type: 'regular' },
      { date: '2027-03-27', title: 'Black Saturday', type: 'special' },
      { date: '2027-04-09', title: 'Araw ng Kagitingan', type: 'regular' },
      { date: '2027-05-01', title: 'Labor Day', type: 'regular' },
      { date: '2027-06-12', title: 'Independence Day', type: 'regular' },
      { date: '2027-08-21', title: 'Ninoy Aquino Day', type: 'special' },
      { date: '2027-08-30', title: 'National Heroes Day', type: 'regular' },
      { date: '2027-11-01', title: 'All Saints\' Day', type: 'special' },
      { date: '2027-11-30', title: 'Bonifacio Day', type: 'regular' },
      { date: '2027-12-08', title: 'Feast of the Immaculate Conception', type: 'special' },
      { date: '2027-12-25', title: 'Christmas Day', type: 'regular' },
      { date: '2027-12-30', title: 'Rizal Day', type: 'regular' },
      { date: '2027-12-31', title: 'Last Day of the Year', type: 'special' },
    ];

    function getHolidaysOn(dateStr) {
      return PH_HOLIDAYS.filter(h => h.date === dateStr);
    }

    // ==================== PERSISTENCE ====================
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          state.events = data.events || [];
          state.tasks = data.tasks || [];
          state.notes = data.notes || [];
          state.goals = data.goals || [];
          state.theme = data.theme || 'light';
        }
      } catch (e) {
        console.warn('Failed to load data', e);
      }
      applyTheme();
    }

    function saveData() {
      const data = {
        events: state.events,
        tasks: state.tasks,
        notes: state.notes,
        goals: state.goals,
        theme: state.theme
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ==================== THEME ====================
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      applyTheme();
      saveData();
      showToast(state.theme === 'dark' ? 'Dark mode on' : 'Light mode on', 'info');
    });

    // ==================== TOAST ====================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('out');
        setTimeout(() => toast.remove(), 250);
      }, 2800);
    }

    // ==================== EXPORT / IMPORT ====================
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = {
        events: state.events,
        tasks: state.tasks,
        notes: state.notes,
        goals: state.goals,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lumina-backup-${formatDate(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Data exported successfully', 'success');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.events) state.events = data.events;
          if (data.tasks) state.tasks = data.tasks;
          if (data.notes) state.notes = data.notes;
          if (data.goals) state.goals = data.goals;
          saveData();
          render();
          showToast('Data imported successfully', 'success');
        } catch (err) {
          showToast('Invalid backup file', 'error');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // Measure the dock so the final control of every tab can scroll above it.
    (function setupMobileScrollClearance() {
      const dock = document.querySelector('.mobile-bottom-nav');
      if (!dock) return;
      const update = () => document.documentElement.style.setProperty('--wm-dock-height', Math.ceil(dock.getBoundingClientRect().height) + 'px');
      update();
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(update).observe(dock);
      window.addEventListener('resize', update, {passive:true});
    })();

    // ==================== NAVIGATION ====================
    document.querySelectorAll('.mobile-nav-btn').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.dataset.view;
        switchView(view);
      });
    });

    function switchView(view) {
      const scrollToProgress = view === 'progress';
      if (scrollToProgress) view = 'dashboard';
      state.currentView = view;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === `view-${view}`));

      const titles = {
        dashboard: 'Today',
        calendar: 'Calendar',
        tasks: 'Tasks',
        notes: 'Notes',
        progress: 'Progress',
        focus: 'Focus',
        whiteboard: 'Whiteboard'
      };
      document.getElementById('viewTitle').textContent = titles[view] || view;

      const actions = {
        dashboard: 'Quick add',
        calendar: 'Quick add',
        tasks: 'Quick add',
        notes: 'Quick add',
        progress: 'Quick add',
        focus: 'Quick add',
        whiteboard: 'Quick add'
      };
      document.getElementById('primaryActionLabel').textContent = actions[view] || 'Quick add';
      document.getElementById('primaryAction').style.display = (view === 'focus' || view === 'whiteboard') ? 'none' : 'inline-flex';

      render();
      if (!scrollToProgress) {
        const content = document.querySelector('.content');
        if (content) {
          // iOS Safari may restore the old tab's scroll offset after render.
          content.scrollTop = 0;
          requestAnimationFrame(() => { content.scrollTop = 0; });
          // Force layout after tab change, and reset even on iOS Safari's late restoration.
          void content.offsetHeight;
          requestAnimationFrame(() => requestAnimationFrame(() => { content.scrollTop = 0; }));
        }
      }
      if (scrollToProgress) requestAnimationFrame(() => document.getElementById('todayProgressSection')?.scrollIntoView({behavior:'smooth', block:'start'}));
    }

    document.getElementById('primaryAction').addEventListener('click', () => {
      const typeMap = {
        dashboard: 'task',
        calendar: 'event',
        tasks: 'task',
        notes: 'note',
        progress: 'goal',
        focus: 'task'
      };
      openModal(typeMap[state.currentView] || 'task');
    });

    document.getElementById('addGoalBtn').addEventListener('click', () => openModal('goal'));

    // ==================== MODAL ====================
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function openModal(type, editItem = null) {
      state.modalType = type;
      state.editingId = editItem ? editItem.id : null;

      const titles = {
        event: editItem ? 'Edit Event' : 'New Event',
        task: editItem ? 'Edit Task' : 'New Task',
        note: editItem ? 'Edit Note' : 'New Note',
        goal: editItem ? 'Edit Goal' : 'New Goal'
      };
      modalTitle.textContent = titles[type];

      // Show Delete button only when editing an existing item
      const deleteBtn = document.getElementById('modalDelete');
      deleteBtn.style.display = state.editingId ? 'inline-flex' : 'none';

      let html = '';
      if (type === 'event') {
        const startDate = editItem?.date || formatDate(new Date());
        const endDate = editItem?.endDate || startDate;
        html = `
          <div class="form-group">
            <label class="form-label">Title</label>
            <input class="form-input" id="f-title" value="${editItem?.title || ''}" placeholder="Event title" autofocus>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-input" id="f-date" value="${startDate}">
            </div>
            <div class="form-group">
              <label class="form-label">End Date</label>
              <input type="date" class="form-input" id="f-end-date" value="${endDate}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Time (optional)</label>
              <input type="time" class="form-input" id="f-time" value="${editItem?.time || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">Repeat</label>
              <select class="form-select" id="f-repeat">
                <option value="none" ${!editItem?.repeat || editItem?.repeat === 'none' ? 'selected' : ''}>Does not repeat</option>
                <option value="daily" ${editItem?.repeat === 'daily' ? 'selected' : ''}>Daily</option>
                <option value="weekly" ${editItem?.repeat === 'weekly' ? 'selected' : ''}>Weekly</option>
                <option value="monthly" ${editItem?.repeat === 'monthly' ? 'selected' : ''}>Monthly</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea class="form-textarea" id="f-notes" placeholder="Optional notes...">${editItem?.notes || ''}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Color</label>
            <div class="color-picker" id="f-color">
              ${COLORS.map(c => `<div class="color-swatch ${(!editItem && c.value === COLORS[0].value) || editItem?.color === c.value ? 'selected' : ''}" data-color="${c.value}" style="background:${c.value}"></div>`).join('')}
            </div>
          </div>
        `;
      } else if (type === 'task') {
        html = `
          <div class="form-group">
            <label class="form-label">Task</label>
            <input class="form-input" id="f-title" value="${editItem?.title || ''}" placeholder="What needs to be done?" autofocus>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Due Date</label>
              <input type="date" class="form-input" id="f-date" value="${editItem?.date || ''}">
            </div>
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select class="form-select" id="f-priority">
                <option value="low" ${editItem?.priority === 'low' ? 'selected' : ''}>Low</option>
                <option value="medium" ${!editItem || editItem?.priority === 'medium' ? 'selected' : ''}>Medium</option>
                <option value="high" ${editItem?.priority === 'high' ? 'selected' : ''}>High</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input class="form-input" id="f-category" value="${editItem?.category || ''}" placeholder="e.g. Work, Personal, Health">
          </div>
        `;
      } else if (type === 'note') {
        html = `
          <div class="form-group">
            <label class="form-label">Title</label>
            <input class="form-input" id="f-title" value="${editItem?.title || ''}" placeholder="Note title" autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">Content</label>
            <textarea class="form-textarea" id="f-content" style="min-height:160px" placeholder="Start writing...">${editItem?.content || ''}</textarea>
          </div>
        `;
      } else if (type === 'goal') {
        html = `
          <div class="form-group">
            <label class="form-label">Goal</label>
            <input class="form-input" id="f-title" value="${editItem?.title || ''}" placeholder="What do you want to achieve?" autofocus>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Target</label>
              <input type="number" class="form-input" id="f-target" value="${editItem?.target || 30}" min="1">
            </div>
            <div class="form-group">
              <label class="form-label">Current</label>
              <input type="number" class="form-input" id="f-current" value="${editItem?.current || 0}" min="0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Unit</label>
            <input class="form-input" id="f-unit" value="${editItem?.unit || 'days'}" placeholder="e.g. days, pages, km">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <input class="form-input" id="f-category" value="${editItem?.category || ''}" placeholder="e.g. Fitness, Learning">
          </div>
          <div class="form-group">
            <label class="form-label">Color</label>
            <div class="color-picker" id="f-color">
              ${COLORS.map(c => `<div class="color-swatch ${(!editItem && c.value === COLORS[4].value) || editItem?.color === c.value ? 'selected' : ''}" data-color="${c.value}" style="background:${c.value}"></div>`).join('')}
            </div>
          </div>
        `;
      }

      modalBody.innerHTML = html;

      // Color picker events
      modalBody.querySelectorAll('.color-swatch').forEach(s => {
        s.addEventListener('click', () => {
          modalBody.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('selected'));
          s.classList.add('selected');
        });
      });

      modalOverlay.classList.add('open');
      setTimeout(() => {
        const first = modalBody.querySelector('input, textarea');
        if (first) first.focus();
      }, 50);
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      state.modalType = null;
      state.editingId = null;
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });

    // Delete current item (works for events, tasks, notes, goals)
    document.getElementById('modalDelete').addEventListener('click', () => {
      if (!state.editingId) return;

      const type = state.modalType;
      const id = state.editingId;
      const labels = { event: 'Event', task: 'Task', note: 'Note', goal: 'Goal' };

      if (type === 'event') {
        state.events = state.events.filter(e => e.id !== id);
      } else if (type === 'task') {
        state.tasks = state.tasks.filter(t => t.id !== id);
      } else if (type === 'goal') {
        state.goals = state.goals.filter(g => g.id !== id);
      } else if (type === 'note') {
        state.notes = state.notes.filter(n => n.id !== id);
        if (state.selectedNoteId === id) state.selectedNoteId = null;
      }

      saveData();
      closeModal();
      render();
      showToast(`${labels[type] || 'Item'} deleted`, 'success');
    });

    document.getElementById('modalSave').addEventListener('click', () => {
      const type = state.modalType;
      const id = state.editingId || generateId();

      if (type === 'event') {
        const title = document.getElementById('f-title').value.trim();
        if (!title) return;
        let startDate = document.getElementById('f-date').value;
        let endDate = document.getElementById('f-end-date').value || startDate;
        if (endDate < startDate) endDate = startDate;
        const item = {
          id,
          title,
          date: startDate,
          endDate: endDate,
          time: document.getElementById('f-time').value || '',
          repeat: document.getElementById('f-repeat')?.value || 'none',
          notes: document.getElementById('f-notes').value,
          color: modalBody.querySelector('.color-swatch.selected')?.dataset.color || COLORS[0].value
        };
        if (state.editingId) {
          const idx = state.events.findIndex(e => e.id === id);
          if (idx >= 0) state.events[idx] = item;
        } else {
          state.events.push(item);
        }
      } else if (type === 'task') {
        const title = document.getElementById('f-title').value.trim();
        if (!title) return;
        const item = {
          id,
          title,
          date: document.getElementById('f-date').value || null,
          priority: document.getElementById('f-priority').value,
          category: document.getElementById('f-category').value.trim() || 'General',
          done: state.editingId ? (state.tasks.find(t => t.id === id)?.done || false) : false,
          createdAt: state.editingId ? (state.tasks.find(t => t.id === id)?.createdAt || Date.now()) : Date.now()
        };
        if (state.editingId) {
          const idx = state.tasks.findIndex(t => t.id === id);
          if (idx >= 0) state.tasks[idx] = item;
        } else {
          state.tasks.push(item);
        }
      } else if (type === 'note') {
        const title = document.getElementById('f-title').value.trim() || 'Untitled';
        const item = {
          id,
          title,
          content: document.getElementById('f-content').value,
          updatedAt: Date.now(),
          createdAt: state.editingId ? (state.notes.find(n => n.id === id)?.createdAt || Date.now()) : Date.now()
        };
        if (state.editingId) {
          const idx = state.notes.findIndex(n => n.id === id);
          if (idx >= 0) state.notes[idx] = item;
        } else {
          state.notes.unshift(item);
          state.selectedNoteId = id;
        }
      } else if (type === 'goal') {
        const title = document.getElementById('f-title').value.trim();
        if (!title) return;
        const item = {
          id,
          title,
          target: parseInt(document.getElementById('f-target').value) || 1,
          current: parseInt(document.getElementById('f-current').value) || 0,
          unit: document.getElementById('f-unit').value.trim() || 'units',
          category: document.getElementById('f-category').value.trim() || 'General',
          color: modalBody.querySelector('.color-swatch.selected')?.dataset.color || COLORS[4].value,
          streak: state.editingId ? (state.goals.find(g => g.id === id)?.streak || 0) : 0
        };
        if (state.editingId) {
          const idx = state.goals.findIndex(g => g.id === id);
          if (idx >= 0) state.goals[idx] = item;
        } else {
          state.goals.push(item);
        }
      }

      const wasEdit = !!state.editingId;
      saveData();
      closeModal();
      render();
      const labels = { event: 'Event', task: 'Task', note: 'Note', goal: 'Goal' };
      showToast(`${labels[type] || 'Item'} ${wasEdit ? 'updated' : 'created'}`, 'success');
    });

    // ==================== HELPERS ====================
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function formatDate(d) {
      // Always use local timezone (fixes UTC off-by-one day issues)
      const date = typeof d === 'string' ? new Date(d + 'T00:00:00') : (d || new Date());
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      // Parse as local date to avoid timezone shift
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function isToday(dateStr) {
      return dateStr === formatDate(new Date());
    }

    function isPast(dateStr) {
      if (!dateStr) return false;
      return dateStr < formatDate(new Date());
    }

    // Returns true if an event (including recurring) occurs on the given dateStr
    function eventOccursOn(e, dateStr) {
      const start = e.date;
      const end = e.endDate || e.date;
      const repeat = e.repeat || 'none';

      if (repeat === 'none') {
        return dateStr >= start && dateStr <= end;
      }

      // For recurring, we treat the original range as the first occurrence
      // and then expand forward from the start date
      if (dateStr < start) return false;

      const startDate = new Date(start + 'T00:00:00');
      const checkDate = new Date(dateStr + 'T00:00:00');
      const diffDays = Math.round((checkDate - startDate) / (1000 * 60 * 60 * 24));

      if (repeat === 'daily') return true;
      if (repeat === 'weekly') return diffDays % 7 === 0;
      if (repeat === 'monthly') {
        return checkDate.getDate() === startDate.getDate();
      }
      return false;
    }

    // ==================== RENDER ====================
    function render() {
      if (state.currentView === 'dashboard') { renderDashboard(); renderProgress(); }
      else if (state.currentView === 'calendar') renderCalendar();
      else if (state.currentView === 'tasks') renderTasks();
      else if (state.currentView === 'notes') renderNotes();

      // focus view is self-contained, no re-render needed
    }

    function renderDashboard() {
      const today = formatDate(new Date());
      const todayTasks = state.tasks.filter(t => t.date === today);
      const todayEvents = state.events.filter(e => eventOccursOn(e, today));
      const completedToday = todayTasks.filter(t => t.done).length;
      const totalTasks = state.tasks.filter(t => !t.done).length;
      const activeGoals = state.goals.length;
      const avgProgress = activeGoals ? Math.round(state.goals.reduce((s, g) => s + Math.min(100, (g.current / g.target) * 100), 0) / activeGoals) : 0;
      const bestStreak = state.goals.reduce((m, g) => Math.max(m, g.streak || 0), 0);

      // Hero
      const now = new Date();
      const hour = now.getHours();
      const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
      const dayName = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
      const dateStr = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric' }).toUpperCase();
      const quotes = [
        'Keep going, gently.',
        'Small steps count.',
        'You got this today.',
        'Bloom at your pace.',
        'One thing at a time.',
        'Soft progress is progress.',
        'Stay kind to yourself.',
        'Make today sweet.',
        'Rhythm over rush.',
        'Little wins matter.'
      ];
      const quote = quotes[Math.floor(Math.random() * quotes.length)];

      document.getElementById('heroBanner').innerHTML = `
        <div class="hero-left">
          <div class="hero-date">${dayName} · ${dateStr}</div>
          <h2>${greet}<span>!</span></h2>
          <p class="hero-quote">“${quote}”</p>
        </div>
        <div class="hero-right">
          <div class="hero-melon"><div class="hero-melon-body"></div></div>
        </div>
      `;

      // Stats matching the screenshot
      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Tasks Done</div>
          <div class="stat-value">${completedToday} <span style="font-size:16px;color:var(--text-tertiary)">/ ${todayTasks.length || 0}</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Focus Time</div>
          <div class="stat-value" style="font-size:22px">Ready</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Current Streak</div>
          <div class="stat-value">${bestStreak} <span style="font-size:16px;color:var(--text-tertiary)">days</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Weekly Goal</div>
          <div class="stat-value">${avgProgress}<span style="font-size:16px">%</span></div>
        </div>
      `;

      // Today's schedule (includes PH holidays)
      const todayHolidays = getHolidaysOn(today);
      const schedule = [
        ...todayHolidays.map(h => ({
          type: 'holiday',
          time: 'PH',
          title: '🇵🇭 ' + h.title,
          color: h.type === 'regular' ? '#2b7b57' : '#c45c7a',
          id: null
        })),
        ...todayEvents.map(e => {
          const isMulti = e.endDate && e.endDate !== e.date;
          return {
            type: 'event',
            time: e.time || (isMulti ? 'Multi' : ''),
            title: e.title + (isMulti ? ` (${formatDisplayDate(e.date)} → ${formatDisplayDate(e.endDate)})` : ''),
            color: e.color,
            id: e.id
          };
        }),
        ...todayTasks.map(t => ({ type: 'task', time: '', title: t.title, color: t.done ? '#4caf70' : '#e85a4f', done: t.done, id: t.id }))
      ].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));

      const schedEl = document.getElementById('todaySchedule');
      if (schedule.length === 0) {
        schedEl.innerHTML = `<div class="empty-state"><p>Nothing scheduled for today. Enjoy the free time or add something!</p></div>`;
      } else {
        schedEl.innerHTML = schedule.map(item => `
          <div class="today-item">
            <span class="today-time">${item.time || '—'}</span>
            <span class="today-dot" style="background:${item.color}"></span>
            <span class="today-title ${item.done ? 'done' : ''}">${item.title}</span>
          </div>
        `).join('');
      }

      // Upcoming
      const upcoming = [
        ...state.events.filter(e => {
          const end = e.endDate || e.date;
          const isRecurring = e.repeat && e.repeat !== 'none';
          return isRecurring || end >= today;
        }).map(e => ({ ...e, type: 'event' })),
        ...state.tasks.filter(t => t.date && t.date >= today && !t.done).map(t => ({ ...t, type: 'task', color: '#e85a4f' }))
      ].sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '')).slice(0, 6);

      const upEl = document.getElementById('upcomingList');
      if (upcoming.length === 0) {
        upEl.innerHTML = `<div class="empty-state"><p>No upcoming items. You're all clear!</p></div>`;
      } else {
        upEl.innerHTML = upcoming.map(item => {
          let dateLabel = formatDisplayDate(item.date);
          if (item.type === 'event' && item.endDate && item.endDate !== item.date) {
            dateLabel = `${formatDisplayDate(item.date)} → ${formatDisplayDate(item.endDate)}`;
          }
          return `
          <div class="today-item">
            <span class="today-time" style="min-width:auto;white-space:nowrap">${dateLabel}</span>
            <span class="today-dot" style="background:${item.color || '#e85a4f'}"></span>
            <span class="today-title">${item.title}</span>
          </div>
        `}).join('');
      }
    }

    function renderCalendar() {
      if (state.calendarMode === 'week') {
        renderWeekView();
      } else {
        renderMonthView();
      }
    }

    function renderMonthView() {
      const year = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDay = firstDay.getDay();
      const daysInMonth = lastDay.getDate();

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('calendarMonth').textContent = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.className = 'calendar-grid';

      const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      let html = dayNames.map(d => `<div class="cal-day-header">${d}</div>`).join('');

      const prevMonthLast = new Date(year, month, 0).getDate();
      for (let i = startDay - 1; i >= 0; i--) {
        const day = prevMonthLast - i;
        const dateStr = formatDate(new Date(year, month - 1, day));
        html += renderCalDay(day, dateStr, true);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = formatDate(new Date(year, month, d));
        html += renderCalDay(d, dateStr, false);
      }

      const totalCells = startDay + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remaining; i++) {
        const dateStr = formatDate(new Date(year, month + 1, i));
        html += renderCalDay(i, dateStr, true);
      }

      grid.innerHTML = html;
      bindCalendarEvents();
    }

    function renderWeekView() {
      // Find the Sunday of the current week based on currentMonth
      const base = new Date(state.currentMonth);
      const dayOfWeek = base.getDay();
      const sunday = new Date(base);
      sunday.setDate(base.getDate() - dayOfWeek);

      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const endOfWeek = new Date(sunday);
      endOfWeek.setDate(sunday.getDate() + 6);
      document.getElementById('calendarMonth').textContent =
        `${monthNames[sunday.getMonth()]} ${sunday.getDate()} – ${monthNames[endOfWeek.getMonth()]} ${endOfWeek.getDate()}, ${endOfWeek.getFullYear()}`;

      const grid = document.getElementById('calendarGrid');
      grid.className = 'calendar-grid week-view';

      const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      let html = `<div class="week-time-label"></div>`;

      // Headers
      for (let i = 0; i < 7; i++) {
        const d = new Date(sunday);
        d.setDate(sunday.getDate() + i);
        const dateStr = formatDate(d);
        const isTod = isToday(dateStr);
        html += `<div class="week-day-header ${isTod ? 'today' : ''}">${dayNames[i]} ${d.getDate()}</div>`;
      }

      // Time slots (simplified: morning / afternoon / evening + all-day)
      const slots = [
        { label: 'All day', key: 'all' },
        { label: 'Morning', key: 'morning' },
        { label: 'Afternoon', key: 'afternoon' },
        { label: 'Evening', key: 'evening' }
      ];

      slots.forEach(slot => {
        html += `<div class="week-time-label">${slot.label}</div>`;
        for (let i = 0; i < 7; i++) {
          const d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          const dateStr = formatDate(d);
          const isTod = isToday(dateStr);

          const dayEvents = state.events.filter(e => {
            if (!eventOccursOn(e, dateStr)) return false;
            if (slot.key === 'all') return !e.time;
            if (!e.time) return false;
            const hour = parseInt(e.time.split(':')[0]);
            if (slot.key === 'morning') return hour < 12;
            if (slot.key === 'afternoon') return hour >= 12 && hour < 17;
            if (slot.key === 'evening') return hour >= 17;
            return false;
          });

          html += `<div class="week-cell ${isTod ? 'today-col' : ''}" data-date="${dateStr}">
            ${dayEvents.map(e => `<div class="day-event" data-event-id="${e.id}" style="background:${e.color};margin-bottom:2px">${e.title}</div>`).join('')}
          </div>`;
        }
      });

      grid.innerHTML = html;
      bindCalendarEvents();
    }

    function bindCalendarEvents() {
      document.querySelectorAll('.day-event[data-event-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const event = state.events.find(ev => ev.id === el.dataset.eventId);
          if (event) openModal('event', event);
        });
      });

      document.querySelectorAll('.cal-day, .week-cell').forEach(el => {
        el.addEventListener('click', () => {
          const date = el.dataset.date;
          if (!date) return;
          state.selectedDate = date;
          openModal('event', { date, endDate: date, time: '', title: '', notes: '', color: COLORS[0].value });
        });
      });
    }

    function renderCalDay(dayNum, dateStr, other) {
      const events = state.events.filter(e => eventOccursOn(e, dateStr));
      const tasks = state.tasks.filter(t => t.date === dateStr && !t.done);
      const holidays = getHolidaysOn(dateStr);
      const isTod = isToday(dateStr);
      const hasHoliday = holidays.length > 0;

      const holidayHtml = holidays.map(h =>
        `<div class="day-event holiday-event ${h.type}" title="🇵🇭 ${h.title} (${h.type === 'regular' ? 'Regular Holiday' : 'Special Non-Working Day'})">🇵🇭 ${h.title}</div>`
      ).join('');

      const maxSlots = 3;
      const usedByHoliday = Math.min(holidays.length, maxSlots);
      const eventSlots = maxSlots - usedByHoliday;

      return `
        <div class="cal-day ${other ? 'other-month' : ''} ${isTod ? 'today' : ''} ${hasHoliday ? 'has-holiday' : ''}" data-date="${dateStr}">
          <div class="day-num">${dayNum}</div>
          <div class="day-events">
            ${holidayHtml}
            ${events.slice(0, eventSlots).map(e => {
              const isMulti = e.endDate && e.endDate !== e.date;
              const isStart = dateStr === e.date;
              let extraClass = '';
              if (isMulti) {
                if (isStart) extraClass = 'multi-start';
                else if (dateStr === (e.endDate || e.date)) extraClass = 'multi-end';
                else extraClass = 'multi-mid';
              }
              const isRecurring = e.repeat && e.repeat !== 'none';
              const label = (isStart || !isMulti ? e.title : '') + (isRecurring && (isStart || !isMulti) ? ' ↻' : '');
              return `<div class="day-event ${extraClass}" data-event-id="${e.id}" style="background:${e.color}" title="${e.title}${isMulti ? ' (multi-day)' : ''}${isRecurring ? ' · repeats ' + e.repeat : ''}">${label}</div>`;
            }).join('')}
            ${tasks.length > 0 && (events.length + holidays.length) < 3 ? `<div class="day-event" style="background:#86868b">${tasks.length} task${tasks.length > 1 ? 's' : ''}</div>` : ''}
          </div>
        </div>
      `;
    }

    // Calendar navigation
    document.getElementById('prevMonth').addEventListener('click', () => {
      if (state.calendarMode === 'week') {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth(), state.currentMonth.getDate() - 7);
      } else {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() - 1, 1);
      }
      renderCalendar();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      if (state.calendarMode === 'week') {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth(), state.currentMonth.getDate() + 7);
      } else {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + 1, 1);
      }
      renderCalendar();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      state.currentMonth = new Date();
      renderCalendar();
    });

    // Month / Week toggle
    document.getElementById('viewMonthBtn').addEventListener('click', () => {
      state.calendarMode = 'month';
      document.getElementById('viewMonthBtn').classList.add('active');
      document.getElementById('viewWeekBtn').classList.remove('active');
      renderCalendar();
    });
    document.getElementById('viewWeekBtn').addEventListener('click', () => {
      state.calendarMode = 'week';
      document.getElementById('viewWeekBtn').classList.add('active');
      document.getElementById('viewMonthBtn').classList.remove('active');
      renderCalendar();
    });

    function renderTasks() {
      // Filters
      const categories = [...new Set(state.tasks.map(t => t.category))];
      const allCount = state.tasks.length;
      const activeCount = state.tasks.filter(t => !t.done).length;
      const doneCount = state.tasks.filter(t => t.done).length;
      const todayCount = state.tasks.filter(t => t.date === formatDate(new Date()) && !t.done).length;

      document.getElementById('taskFilters').innerHTML = `
        <button class="filter-item ${state.taskFilter === 'all' ? 'active' : ''}" data-filter="all">
          All <span class="filter-count">${allCount}</span>
        </button>
        <button class="filter-item ${state.taskFilter === 'active' ? 'active' : ''}" data-filter="active">
          Active <span class="filter-count">${activeCount}</span>
        </button>
        <button class="filter-item ${state.taskFilter === 'today' ? 'active' : ''}" data-filter="today">
          Today <span class="filter-count">${todayCount}</span>
        </button>
        <button class="filter-item ${state.taskFilter === 'done' ? 'active' : ''}" data-filter="done">
          Completed <span class="filter-count">${doneCount}</span>
        </button>
        ${categories.length ? '<div style="height:12px"></div>' : ''}
        ${categories.map(c => {
          const count = state.tasks.filter(t => t.category === c).length;
          return `<button class="filter-item ${state.taskFilter === 'cat:' + c ? 'active' : ''}" data-filter="cat:${c}">
            ${c} <span class="filter-count">${count}</span>
          </button>`;
        }).join('')}
      `;

      document.querySelectorAll('.filter-item').forEach(btn => {
        btn.addEventListener('click', () => {
          state.taskFilter = btn.dataset.filter;
          renderTasks();
        });
      });

      // Task list
      let filtered = state.tasks;
      if (state.taskFilter === 'active') filtered = filtered.filter(t => !t.done);
      else if (state.taskFilter === 'done') filtered = filtered.filter(t => t.done);
      else if (state.taskFilter === 'today') filtered = filtered.filter(t => t.date === formatDate(new Date()) && !t.done);
      else if (state.taskFilter.startsWith('cat:')) {
        const cat = state.taskFilter.slice(4);
        filtered = filtered.filter(t => t.category === cat);
      }

      filtered = [...filtered].sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const pOrder = { high: 0, medium: 1, low: 2 };
        return (pOrder[a.priority] || 1) - (pOrder[b.priority] || 1);
      });

      const listEl = document.getElementById('taskList');
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <h3>No tasks here</h3>
          <p>Create a new task to get started</p>
        </div>`;
      } else {
        listEl.innerHTML = filtered.map(t => `
          <div class="task-item" data-id="${t.id}">
            <button class="task-check ${t.done ? 'done' : ''}" data-id="${t.id}">
              ${t.done ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
            </button>
            <div class="task-content">
              <div class="task-title ${t.done ? 'done' : ''}">${t.title}</div>
              <div class="task-meta">
                <span class="task-priority priority-${t.priority}"></span>
                <span>${t.category}</span>
                ${t.date ? `<span>• ${formatDisplayDate(t.date)}</span>` : ''}
              </div>
            </div>
            <div class="task-actions">
              <button class="btn-icon" data-edit="${t.id}" title="Edit">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-icon" data-delete="${t.id}" title="Delete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </div>
          </div>
        `).join('');

        listEl.querySelectorAll('.task-check').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const task = state.tasks.find(t => t.id === id);
            if (task) {
              task.done = !task.done;
              saveData();
              render();
            }
          });
        });

        listEl.querySelectorAll('[data-edit]').forEach(btn => {
          btn.addEventListener('click', () => {
            const task = state.tasks.find(t => t.id === btn.dataset.edit);
            if (task) openModal('task', task);
          });
        });

        listEl.querySelectorAll('[data-delete]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.tasks = state.tasks.filter(t => t.id !== btn.dataset.delete);
            saveData();
            render();
            showToast('Task deleted', 'success');
          });
        });
      }
    }

    function renderNotes() {
      const listEl = document.getElementById('notesList');
      if (state.notes.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><p>No notes yet</p></div>`;
      } else {
        listEl.innerHTML = state.notes.map(n => `
          <div class="note-item ${state.selectedNoteId === n.id ? 'active' : ''}" data-id="${n.id}">
            <div class="note-item-title">${n.title}</div>
            <div class="note-item-preview">${n.content || 'Empty note'}</div>
            <div class="note-item-date">${new Date(n.updatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
          </div>
        `).join('');

        listEl.querySelectorAll('.note-item').forEach(el => {
          el.addEventListener('click', () => {
            state.selectedNoteId = el.dataset.id;
            renderNotes();
          });
        });
      }

      const editor = document.getElementById('noteEditor');
      const note = state.notes.find(n => n.id === state.selectedNoteId);
      if (!note) {
        editor.innerHTML = `
          <div class="empty-note">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <p>Select a note or create a new one</p>
          </div>
        `;
      } else {
        editor.innerHTML = `
          <div class="note-editor-header">
            <input class="note-title-input" id="noteTitle" value="${note.title}">
            <button class="btn-icon" id="deleteNote" title="Delete">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
          <textarea class="note-body" id="noteBody" placeholder="Start writing...">${note.content}</textarea>
        `;

        const saveNote = () => {
          note.title = document.getElementById('noteTitle').value || 'Untitled';
          note.content = document.getElementById('noteBody').value;
          note.updatedAt = Date.now();
          saveData();
          // Soft update list without full re-render to keep focus
          const item = listEl.querySelector(`[data-id="${note.id}"]`);
          if (item) {
            item.querySelector('.note-item-title').textContent = note.title;
            item.querySelector('.note-item-preview').textContent = note.content || 'Empty note';
          }
        };

        document.getElementById('noteTitle').addEventListener('input', saveNote);
        document.getElementById('noteBody').addEventListener('input', saveNote);
        document.getElementById('deleteNote').addEventListener('click', () => {
          state.notes = state.notes.filter(n => n.id !== note.id);
          state.selectedNoteId = state.notes[0]?.id || null;
          saveData();
          renderNotes();
          showToast('Note deleted', 'success');
        });
      }
    }

    function renderProgress() {
      const grid = document.getElementById('goalsGrid');

      // Build last 28 days activity heatmap (based on completed tasks + goal increments)
      const today = new Date();
      const heatDays = [];
      for (let i = 27; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = formatDate(d);
        const completedTasks = state.tasks.filter(t => t.done && t.date === dateStr).length;
        // Simple activity score
        const score = completedTasks;
        let level = 0;
        if (score >= 1) level = 1;
        if (score >= 2) level = 2;
        if (score >= 4) level = 3;
        if (score >= 6) level = 4;
        heatDays.push({ date: dateStr, level, score });
      }

      const heatmapHTML = `
        <div class="card" style="grid-column:1/-1;margin-bottom:8px">
          <div class="card-header">
            <h3>Activity — Last 4 Weeks</h3>
          </div>
          <div class="card-body">
            <div class="heatmap">
              ${heatDays.map(h => `<div class="heatmap-day level-${h.level}" title="${h.date}: ${h.score} completed"></div>`).join('')}
            </div>
            <div class="heatmap-legend">
              Less
              <div class="heatmap-day" style="width:12px;height:12px"></div>
              <div class="heatmap-day level-1" style="width:12px;height:12px"></div>
              <div class="heatmap-day level-2" style="width:12px;height:12px"></div>
              <div class="heatmap-day level-3" style="width:12px;height:12px"></div>
              <div class="heatmap-day level-4" style="width:12px;height:12px"></div>
              More
            </div>
          </div>
        </div>
      `;

      if (state.goals.length === 0) {
        grid.innerHTML = heatmapHTML + `
          <div class="empty-state" style="grid-column:1/-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <h3>No goals yet</h3>
            <p>Set a goal and track your progress over time</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = heatmapHTML + state.goals.map(g => {
        const pct = Math.min(100, Math.round((g.current / g.target) * 100));
        return `
          <div class="goal-card">
            <div class="goal-header">
              <div>
                <div class="goal-title">${g.title}</div>
                <div class="goal-category">${g.category}</div>
              </div>
              ${g.streak > 0 ? `<span class="streak-badge">🔥 ${g.streak}</span>` : ''}
            </div>
            <div class="goal-progress-bar">
              <div class="goal-progress-fill" style="width:${pct}%;background:${g.color}"></div>
            </div>
            <div class="goal-stats">
              <span>${g.current} / ${g.target} ${g.unit}</span>
              <span>${pct}%</span>
            </div>
            <div class="goal-actions">
              <button class="btn btn-secondary" data-inc="${g.id}" style="flex:1">+1 Progress</button>
              <button class="btn-icon" data-edit-goal="${g.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="btn-icon" data-del-goal="${g.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-inc]').forEach(btn => {
        btn.addEventListener('click', () => {
          const goal = state.goals.find(g => g.id === btn.dataset.inc);
          if (goal) {
            goal.current = Math.min(goal.target, goal.current + 1);
            goal.streak = (goal.streak || 0) + 1;
            saveData();
            renderProgress();
          }
        });
      });

      grid.querySelectorAll('[data-edit-goal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const goal = state.goals.find(g => g.id === btn.dataset.editGoal);
          if (goal) openModal('goal', goal);
        });
      });

      grid.querySelectorAll('[data-del-goal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.goals = state.goals.filter(g => g.id !== btn.dataset.delGoal);
          saveData();
          renderProgress();
          showToast('Goal deleted', 'success');
        });
      });
    }

    // ==================== FOCUS TIMER ====================
    let focusInterval = null;
    let focusRemaining = 25 * 60;
    let focusRunning = false;
    let focusTotal = 25 * 60;

    function updateFocusDisplay() {
      const m = Math.floor(focusRemaining / 60);
      const s = focusRemaining % 60;
      document.getElementById('focusDisplay').textContent =
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    document.querySelectorAll('.focus-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (focusRunning) return;
        document.querySelectorAll('.focus-mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mins = parseInt(btn.dataset.mins);
        focusTotal = mins * 60;
        focusRemaining = focusTotal;
        updateFocusDisplay();
        document.getElementById('focusStatus').textContent = 'Ready to focus';
      });
    });

    document.getElementById('focusStart').addEventListener('click', () => {
      if (focusRunning) {
        // Pause
        clearInterval(focusInterval);
        focusRunning = false;
        document.getElementById('focusStart').textContent = 'Resume';
        document.getElementById('focusStatus').textContent = 'Paused';
      } else {
        focusRunning = true;
        document.getElementById('focusStart').textContent = 'Pause';
        document.getElementById('focusStatus').textContent = 'Focusing... stay in the zone';
        focusInterval = setInterval(() => {
          focusRemaining--;
          updateFocusDisplay();
          if (focusRemaining <= 0) {
            clearInterval(focusInterval);
            focusRunning = false;
            document.getElementById('focusStart').textContent = 'Start';
            document.getElementById('focusStatus').textContent = 'Session complete! Great work.';
            showToast('Focus session complete 🎉', 'success');
            // Browser notification if permitted
            if (Notification.permission === 'granted') {
              new Notification('Watermelon', { body: 'Focus session complete!' });
            }
          }
        }, 1000);
      }
    });

    document.getElementById('focusReset').addEventListener('click', () => {
      clearInterval(focusInterval);
      focusRunning = false;
      focusRemaining = focusTotal;
      updateFocusDisplay();
      document.getElementById('focusStart').textContent = 'Start';
      document.getElementById('focusStatus').textContent = 'Ready to focus';
    });

    // Request notification permission quietly
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // ==================== GLOBAL SEARCH ====================
    document.getElementById('globalSearch').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return;

      // Simple search: jump to matching view + highlight conceptually
      const taskMatch = state.tasks.find(t => t.title.toLowerCase().includes(q));
      const noteMatch = state.notes.find(n => n.title.toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q));
      const eventMatch = state.events.find(ev => ev.title.toLowerCase().includes(q));
      const goalMatch = state.goals.find(g => g.title.toLowerCase().includes(q));

      if (taskMatch) {
        switchView('tasks');
        showToast(`Found task: ${taskMatch.title}`, 'info');
      } else if (noteMatch) {
        state.selectedNoteId = noteMatch.id;
        switchView('notes');
        showToast(`Found note: ${noteMatch.title}`, 'info');
      } else if (eventMatch) {
        switchView('calendar');
        showToast(`Found event: ${eventMatch.title}`, 'info');
      } else if (goalMatch) {
        switchView('progress');
        showToast(`Found goal: ${goalMatch.title}`, 'info');
      }
    });

    // ==================== KEYBOARD SHORTCUTS ====================
    document.addEventListener('keydown', (e) => {
      // Cmd/Ctrl + K → focus search
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('globalSearch').focus();
      }
      // Cmd/Ctrl + N → new item
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        document.getElementById('primaryAction').click();
      }
      // Escape → close modal
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // ==================== WHITEBOARD ====================
    const wb = {
      canvas: null,
      ctx: null,
      tool: 'pen',
      color: '#2a221e',
      size: 3,
      drawing: false,
      startX: 0,
      startY: 0,
      history: [],
      historyStep: -1,
      snapshot: null
    };

    function initWhiteboard() {
      wb.canvas = document.getElementById('wbCanvas');
      if (!wb.canvas) return;
      wb.ctx = wb.canvas.getContext('2d');
      resizeWhiteboard();
      loadWhiteboard();

      // Tools
      document.querySelectorAll('.wb-tool').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.wb-tool').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          wb.tool = btn.dataset.tool;
          wb.canvas.style.cursor = wb.tool === 'eraser' ? 'cell' : 'crosshair';
        });
      });

      // Colors
      document.querySelectorAll('.wb-color').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.wb-color').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          wb.color = btn.dataset.color;
        });
      });

      // Size
      document.getElementById('wbSize').addEventListener('input', (e) => {
        wb.size = parseInt(e.target.value);
      });

      // Actions
      document.getElementById('wbClear').addEventListener('click', () => {
        wb.ctx.clearRect(0, 0, wb.canvas.width, wb.canvas.height);
        saveHistory();
        showToast('Whiteboard cleared', 'info');
      });

      document.getElementById('wbUndo').addEventListener('click', () => {
        if (wb.historyStep > 0) {
          wb.historyStep--;
          const img = new Image();
          img.onload = () => {
            wb.ctx.clearRect(0, 0, wb.canvas.width, wb.canvas.height);
            wb.ctx.drawImage(img, 0, 0);
          };
          img.src = wb.history[wb.historyStep];
        }
      });

      document.getElementById('wbSave').addEventListener('click', () => {
        persistWhiteboard();
        showToast('Whiteboard saved', 'success');
      });

      // Drawing events
      wb.canvas.addEventListener('mousedown', wbStart);
      wb.canvas.addEventListener('mousemove', wbMove);
      wb.canvas.addEventListener('mouseup', wbEnd);
      wb.canvas.addEventListener('mouseleave', wbEnd);

      // Touch support
      wb.canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        const rect = wb.canvas.getBoundingClientRect();
        wbStart({ clientX: t.clientX, clientY: t.clientY, target: wb.canvas });
      }, { passive: false });
      wb.canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        wbMove({ clientX: t.clientX, clientY: t.clientY });
      }, { passive: false });
      wb.canvas.addEventListener('touchend', wbEnd);

      window.addEventListener('resize', () => {
        const data = wb.canvas.toDataURL();
        resizeWhiteboard();
        const img = new Image();
        img.onload = () => wb.ctx.drawImage(img, 0, 0);
        img.src = data;
      });
    }

    function resizeWhiteboard() {
      const wrap = document.querySelector('.wb-canvas-wrap');
      if (!wrap || !wb.canvas) return;
      const rect = wrap.getBoundingClientRect();
      wb.canvas.width = rect.width * window.devicePixelRatio;
      wb.canvas.height = rect.height * window.devicePixelRatio;
      wb.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      wb.canvas.style.width = rect.width + 'px';
      wb.canvas.style.height = rect.height + 'px';
    }

    function getPos(e) {
      const rect = wb.canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function wbStart(e) {
      wb.drawing = true;
      const pos = getPos(e);
      wb.startX = pos.x;
      wb.startY = pos.y;
      wb.snapshot = wb.ctx.getImageData(0, 0, wb.canvas.width, wb.canvas.height);

      if (wb.tool === 'pen' || wb.tool === 'eraser') {
        wb.ctx.beginPath();
        wb.ctx.moveTo(pos.x, pos.y);
      }
    }

    function wbMove(e) {
      if (!wb.drawing) return;
      const pos = getPos(e);

      if (wb.tool === 'pen' || wb.tool === 'eraser') {
        wb.ctx.lineWidth = wb.tool === 'eraser' ? wb.size * 4 : wb.size;
        wb.ctx.lineCap = 'round';
        wb.ctx.lineJoin = 'round';
        wb.ctx.strokeStyle = wb.tool === 'eraser'
          ? (document.documentElement.getAttribute('data-theme') === 'dark' ? '#1c1c1e' : '#ffffff')
          : wb.color;
        wb.ctx.globalCompositeOperation = wb.tool === 'eraser' ? 'destination-out' : 'source-over';
        wb.ctx.lineTo(pos.x, pos.y);
        wb.ctx.stroke();
        wb.ctx.beginPath();
        wb.ctx.moveTo(pos.x, pos.y);
      } else {
        // Shape preview
        wb.ctx.putImageData(wb.snapshot, 0, 0);
        wb.ctx.globalCompositeOperation = 'source-over';
        wb.ctx.strokeStyle = wb.color;
        wb.ctx.lineWidth = wb.size;
        wb.ctx.beginPath();
        if (wb.tool === 'rect') {
          wb.ctx.strokeRect(wb.startX, wb.startY, pos.x - wb.startX, pos.y - wb.startY);
        } else if (wb.tool === 'circle') {
          const radius = Math.sqrt(Math.pow(pos.x - wb.startX, 2) + Math.pow(pos.y - wb.startY, 2));
          wb.ctx.arc(wb.startX, wb.startY, radius, 0, Math.PI * 2);
          wb.ctx.stroke();
        } else if (wb.tool === 'line') {
          wb.ctx.moveTo(wb.startX, wb.startY);
          wb.ctx.lineTo(pos.x, pos.y);
          wb.ctx.stroke();
        }
      }
    }

    function wbEnd() {
      if (!wb.drawing) return;
      wb.drawing = false;
      wb.ctx.globalCompositeOperation = 'source-over';
      wb.ctx.beginPath();
      saveHistory();
    }

    function saveHistory() {
      wb.historyStep++;
      if (wb.historyStep < wb.history.length) {
        wb.history.length = wb.historyStep;
      }
      wb.history.push(wb.canvas.toDataURL());
      // Limit history
      if (wb.history.length > 30) {
        wb.history.shift();
        wb.historyStep--;
      }
    }

    function persistWhiteboard() {
      try {
        localStorage.setItem('lumina_whiteboard', wb.canvas.toDataURL());
      } catch (e) {
        console.warn('Could not save whiteboard', e);
      }
    }

    function loadWhiteboard() {
      const data = localStorage.getItem('lumina_whiteboard');
      if (data) {
        const img = new Image();
        img.onload = () => {
          wb.ctx.drawImage(img, 0, 0, wb.canvas.width / window.devicePixelRatio, wb.canvas.height / window.devicePixelRatio);
          saveHistory();
        };
        img.src = data;
      } else {
        saveHistory();
      }
    }

    // Re-init canvas when switching to whiteboard view
    const originalSwitchView = switchView;
    switchView = function(view) {
      originalSwitchView(view);
      if (view === 'whiteboard') {
        setTimeout(() => {
          if (!wb.canvas) initWhiteboard();
          else resizeWhiteboard();
        }, 50);
      }
    };

    // ==================== SERVICE WORKER (PWA) ====================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }

    // ==================== INIT ====================
    loadData();
    render();
    updateFocusDisplay();

    </script>

  <script>
    (() => {
      const win = window.watermelonWindow;
      if (!win) { document.getElementById('wmTitlebar').style.display='none'; document.querySelector('.app').style.setProperty('height','100vh','important'); return; }
      document.getElementById('wmMinimize').addEventListener('click', () => win.minimize());
      document.getElementById('wmMaximize').addEventListener('click', () => win.toggleMaximize());
      document.getElementById('wmClose').addEventListener('click', () => win.close());
      win.onMaximized((isMax) => { document.getElementById('wmMaximize').title = isMax ? 'Restore' : 'Maximize'; });
    })();
  </script>

  <script>
    // Collapsible sidebar with a 12-second inactivity timer.
    (() => {
      const sidebar = document.getElementById('wmSidebar');
      const toggle = document.getElementById('sidebarToggle');
      const delay = 12000;
      let idleTimer;
      if (!sidebar || !toggle) return;
      const update = (collapsed) => {
        sidebar.classList.toggle('is-collapsed', collapsed);
        toggle.setAttribute('aria-expanded', String(!collapsed));
        toggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
        toggle.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        sidebar.querySelectorAll('.nav-item, .theme-toggle, .export-btn').forEach(el => {
          const label = el.textContent.trim();
          if (label) el.title = collapsed ? label : '';
        });
      };
      const scheduleCollapse = () => {
        clearTimeout(idleTimer);
        if (!sidebar.classList.contains('is-collapsed')) {
          idleTimer = setTimeout(() => update(true), delay);
        }
      };
      toggle.addEventListener('click', () => {
        update(!sidebar.classList.contains('is-collapsed'));
        scheduleCollapse();
      });
      sidebar.addEventListener('pointerenter', () => clearTimeout(idleTimer));
      sidebar.addEventListener('pointerleave', scheduleCollapse);
      sidebar.addEventListener('focusin', () => clearTimeout(idleTimer));
      sidebar.addEventListener('focusout', scheduleCollapse);
      sidebar.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', scheduleCollapse));
      scheduleCollapse();
    })();
  </script>
</body>
